syntax = "proto3";

package grpc_server;

// Request with start and end coordinates
message RouteRequest {
  double start_lat = 1;
  double start_lng = 2;
  double end_lat = 3;
  double end_lng = 4;
}

// Response with a path (list of "lat,lng" strings), transport mode, and distance
message RouteResponse {
  repeated string path = 1;
  string transport_mode = 2;
  double distance = 3;
}

// Service definition
service TransportService {
  rpc GetRoute(RouteRequest) returns (RouteResponse);
}
